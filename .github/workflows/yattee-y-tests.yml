# Run the unit test suite (Swift Testing) in the iOS Simulator for every push to the fork.
# The host app needs its iCloud/app-group entitlements to launch, so it is ad-hoc signed
# ("Sign to Run Locally"), which the simulator accepts without a provisioning profile.
name: Yattee Y tests

on:
  workflow_dispatch:
  push:
    branches: [yuwei]

concurrency:
  group: yattee-y-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'yuwei-liang/yattee'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.2*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Test
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Simulator $SIM"
          xcodebuild test -project Yattee.xcodeproj -scheme Yattee -destination "id=$SIM" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            | grep -E "✔|✘|Test run|error:|failed|passed|TEST (SUCCEEDED|FAILED)" | tail -n 300
