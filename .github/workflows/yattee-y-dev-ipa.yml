# Build a development-signed Yattee Y IPA for registered test devices (e.g. the iPhone XR
# on Yuwei's desk), so it can be installed from the Mac with `xcrun devicectl` and its
# app container (logs) read back. Manual trigger only; same API-key signing as TestFlight.
name: Yattee Y dev IPA

on:
  workflow_dispatch:

jobs:
  ios-dev:
    if: github.repository == 'yuwei-liang/yattee' && github.actor == 'yuwei-liang'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.2*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install signing certificate
        # One fixed Apple Development certificate from secrets, so automatic signing
        # does not mint a new certificate on every fresh runner (Apple caps them).
        env:
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          KPW=$(openssl rand -hex 12)
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          printf '%s' "$DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/ci.p12"
          security import "$RUNNER_TEMP/ci.p12" -P "$DEV_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/ci.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Development" || { echo "certificate import failed"; exit 1; }
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Yattee.xcodeproj -scheme Yattee -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/YatteeY.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) YATTEE_DEV_LOG' \
            | tail -n 100

      - name: Export development IPA
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>debugging</string>
            <key>teamID</key><string>234Y5MB95R</string>
            <key>signingStyle</key><string>automatic</string>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/YatteeY.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | tail -n 60
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: yattee-y-dev-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Remove signing keychain
        if: always()
        run: '[ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true'
