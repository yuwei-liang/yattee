          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Development" || { echo "certificate import failed"; exit 1; }
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ARCHIVE=$RUNNER_TEMP/YatteeY-tv.xcarchive" >> "$GITHUB_ENV"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Set build number
        run: |
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD/" Yattee.xcodeproj/project.pbxproj
          echo "Build number $BUILD"

      - name: Archive
        # Ad-hoc signed here: a development-signed archive needs a registered Apple TV, and
        # the team has none. The export below re-signs with distribution identities.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Yattee.xcodeproj -scheme Yattee -configuration Release \
            -destination 'generic/platform=tvOS' -archivePath "$ARCHIVE" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee "$RUNNER_TEMP/build.log" | grep -vE "DVTAssertions|SimDevice|^Object:|^Method:|^Thread:|Please file a bug|supportedArches|^\)$" | tail -n 200 || { grep -iE "error|failed" "$RUNNER_TEMP/build.log" | grep -v DVT | sort -u | head -60; exit 1; }

